# SPDX-License-Identifier: LGPL-2.1-or-later
version = 1

[[annotations]]
path = "safetynet/icons/*.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "SafetyNet contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Hand-drawn in FreeCAD's icon style (Tango palette). Compositions follow the
# Tabler Icons (MIT) and Pictogrammers MDI (Apache-2.0) glyphs named in
# safetynet/icons/CREDITS.md; no source paths were copied. Licence texts: LICENSES/.

[[annotations]]
path = ["FILES", "package.xml", "CHANGELOG.md", ".gitignore", ".github/**", "safetynet/icons/CREDITS.md", "tests/data/**"]
SPDX-FileCopyrightText = "SafetyNet contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
